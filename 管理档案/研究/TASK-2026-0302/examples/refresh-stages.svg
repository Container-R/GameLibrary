<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080" role="img" aria-labelledby="title desc">
<title id="title">移动派生状态的完整阶段与逐块决策</title>
<desc id="desc">主线程先关闭读取、捕获配置并处理生命周期失效。生产者调度后，刷新作业依赖生产者，收到完整域的所有块。强制全量或任一输入可能变化则重算，否则不取得可写输出。所有块完成并完成依赖后，才放行读者。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker></defs>
<rect width="1280" height="1080" fill="#f8fafc"/>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#0f172a">
<text x="640" y="49" text-anchor="middle" font-size="34" fill="#0f172a" font-weight="bold">从完整输入到可读输出：一个周期</text>
<text x="640" y="86" text-anchor="middle" font-size="21" fill="#475569" font-weight="normal">实线表示阶段 / 作业先后；框内决策对完整处理域的每个块执行</text>
<rect x="265" y="112" width="750" height="108" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="640" y="145" text-anchor="middle" font-size="26" fill="#0f172a" font-weight="bold">① 阶段所有者：关闭读取，捕获 speedCap</text>
<text x="640" y="179" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="normal">有生命周期请求：标记全量 → 等待已登记作业 → 执行修改</text>
<text x="640" y="207" text-anchor="middle" font-size="20" fill="#075985" font-weight="normal">首次、重启、配置改变也触发全量</text>
<polyline points="640,220 640,251" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="325" y="254" width="630" height="76" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="640" y="285" text-anchor="middle" font-size="26" fill="#0f172a" font-weight="bold">② 输入生产组</text>
<text x="640" y="315" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="normal">写入 MoveBase / MoveFactors，登记 Dependency</text>
<polyline points="640,330 640,363" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="55" y="369" width="1170" height="495" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="88" y="405" text-anchor="start" font-size="25" fill="#0f172a" font-weight="bold">③ 刷新 job：依赖生产者，查询不预先做变化过滤</text>
<text x="640" y="445" text-anchor="middle" font-size="22" fill="#475569" font-weight="normal">完整域的所有块都可以到达 Execute</text>
<polyline points="640,459 640,489" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M640,492 L930,578 L640,664 L350,578 Z" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="640" y="553" text-anchor="middle" font-size="24" fill="#0f172a" font-weight="bold">ForceFull</text>
<text x="640" y="588" text-anchor="middle" font-size="23" fill="#0f172a" font-weight="normal">OR Base.DidChange</text>
<text x="640" y="622" text-anchor="middle" font-size="23" fill="#0f172a" font-weight="normal">OR Factors.DidChange ?</text>
<polyline points="350,578 240,578 240,714" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="266" y="561" text-anchor="middle" font-size="23" fill="#0f172a" font-weight="normal">否</text>
<rect x="92" y="718" width="330" height="93" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="257" y="752" text-anchor="middle" font-size="26" fill="#0f172a" font-weight="bold">跳过该块</text>
<text x="257" y="787" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="normal">不取得可写输出数组</text>
<polyline points="930,578 1040,578 1040,714" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1008" y="561" text-anchor="middle" font-size="23" fill="#0f172a" font-weight="normal">是</text>
<rect x="790" y="718" width="400" height="93" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="990" y="752" text-anchor="middle" font-size="24" fill="#0f172a" font-weight="bold">取得数组并重算匹配实体</text>
<text x="990" y="787" text-anchor="middle" font-size="20" fill="#0f172a" font-weight="normal">所有候选完整处理，不按预算截断</text>
<polyline points="257,811 257,840 638,840" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="990,811 990,840 642,840" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="640,840 640,889" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="235" y="894" width="810" height="68" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="640" y="923" text-anchor="middle" font-size="25" fill="#0f172a" font-weight="bold">全部块处理结束，Dependency.Complete() 完成</text>
<text x="640" y="950" text-anchor="middle" font-size="21" fill="#0f172a" font-weight="normal">此时才清除全量请求，并设置本轮 Readable</text>
<polyline points="640,962 640,990" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="265" y="995" width="750" height="62" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="640" y="1022" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="bold">④ 读者组：门打开才调度读取；离组关闭新的读取准入</text>
<text x="640" y="1048" text-anchor="middle" font-size="20" fill="#0f172a" font-weight="normal">已经调度的读者 job 继续受依赖保护</text>
</g></svg>