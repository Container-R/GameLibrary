<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<title>直段模块接口：足迹、枢轴、端口与楼板</title>
<rect width="1200" height="720" fill="#f7f9fc"/>
<style>text{font-family:Noto Sans CJK SC, sans-serif;fill:#193047;font-size:20px} .small{font-size:17px} .title{font-size:30px;font-weight:700} .sub{font-size:24px;font-weight:600} .mono{font-family:Noto Sans Mono CJK SC,monospace;font-size:18px}</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#234b70"/></marker></defs>
<text x="34" y="48" class="title" >接口规格：同一个模块，需要两个视图</text>
<text x="34" y="84" class="small" >原创示例。单位：米；X 向东、Y 向北、Z 向上。图形按标注坐标绘制。</text>
<text x="74" y="132" class="sub" >俯视：S 直段</text>
<rect x="120" y="150" width="320" height="320" fill="#e2e9f2" stroke="#7592aa" stroke-width="2" />
<rect x="120" y="230" width="320" height="160" fill="#d5f2e8" stroke="#038768" stroke-width="2" />
<line x1="120" y1="310" x2="440" y2="310" stroke="#038768" stroke-width="3" stroke-dasharray="6 5"/>
<circle cx="280" cy="310" r="6" fill="#243d59"/>
<text x="160" y="348" class="small" >枢轴 XY = (0,0)</text>
<line x1="120" y1="230" x2="120" y2="390" stroke="#008c8e" stroke-width="6" />
<line x1="440" y1="230" x2="440" y2="390" stroke="#008c8e" stroke-width="6" />
<circle cx="120" cy="310" r="5" fill="#05836b"/>
<circle cx="440" cy="310" r="5" fill="#05836b"/>
<line x1="120" y1="310" x2="66" y2="310" stroke="#234b70" stroke-width="2" marker-end="url(#arr)"/>
<line x1="440" y1="310" x2="496" y2="310" stroke="#234b70" stroke-width="2" marker-end="url(#arr)"/>
<text x="56" y="290" class="" >W</text>
<text x="474" y="290" class="" >E</text>
<text x="112" y="506" class="mono" >足迹：[-2,2] × [-2,2]</text>
<text x="112" y="540" class="small" >绿色带：内部必须保持的通行空间</text>
<line x1="120" y1="570" x2="440" y2="570" stroke="#234b70" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="238" y="600" class="" >4 米</text>
<line x1="510" y1="208" x2="558" y2="208" stroke="#234b70" stroke-width="2" marker-end="url(#arr)"/>
<text x="549" y="239" class="small" >+X</text>
<line x1="510" y1="208" x2="510" y2="160" stroke="#234b70" stroke-width="2" marker-end="url(#arr)"/>
<text x="486" y="150" class="small" >+Y</text>
<text x="700" y="132" class="sub" >东端口截面：x = 2</text>
<rect x="700" y="182" width="320" height="288" fill="#e2e9f2" stroke="#7592aa" stroke-width="2" />
<rect x="780" y="214" width="160" height="224" fill="#f7f9fc" stroke="#008c8e" stroke-width="2" />
<rect x="700" y="438" width="320" height="32" fill="#b39163" stroke="#896d46" stroke-width="2" />
<circle cx="860" cy="438" r="6" fill="#05836b"/>
<text x="790" y="408" class="mono" >q = (2,0,0.4)</text>
<text x="808" y="290" class="" >开口净空</text>
<text x="816" y="325" class="" >2 × 2.8</text>
<line x1="780" y1="493" x2="940" y2="493" stroke="#234b70" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="835" y="523" class="" >2 米</text>
<line x1="1060" y1="214" x2="1060" y2="438" stroke="#234b70" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="1073" y="329" class="small" >2.8 米</text>
<text x="688" y="173" class="small" >z = 3.6</text>
<text x="682" y="213" class="small" >3.2</text>
<text x="666" y="440" class="small" >0.4</text>
<text x="675" y="477" class="small" >0</text>
<text x="700" y="562" class="small" >棕色：实体楼板 z ∈ [0,0.4]</text>
<text x="700" y="595" class="small" >门洞底边在实际行走面上；轮廓不能被模型侵占。</text>
<line x1="34" y1="635" x2="1166" y2="635" stroke="#bacad8" stroke-width="1" />
<text x="34" y="672" class="small" >此图规定待制作的空间，不包含最终网格、碰撞或导航。非端口部位的结构也必须留在占用范围内。</text>
</svg>