troke="#536777" stroke-width="2" marker-end="url(#arrow)"/><text x="767" y="233" font-size="23" fill="#203444" font-weight="normal" text-anchor="start">Z</text><line x1="820" y1="715" x2="1375" y2="715" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><text x="1380" y="724" font-size="23" fill="#203444" font-weight="normal" text-anchor="start">X</text><line x1="820" y1="709" x2="820" y2="721" stroke="#536777" stroke-width="2"/><text x="820" y="751" font-size="21" fill="#203444" font-weight="normal" text-anchor="middle">0</text><line x1="950" y1="709" x2="950" y2="721" stroke="#536777" stroke-width="2"/><text x="950" y="751" font-size="21" fill="#203444" font-weight="normal" text-anchor="middle">1</text><line x1="1080" y1="709" x2="1080" y2="721" stroke="#536777" stroke-width="2"/><text x="1080" y="751" font-size="21" fill="#203444" font-weight="normal" text-anchor="middle">2</text><line x1="1210" y1="709" x2="1210" y2="721" stroke="#536777" stroke-width="2"/><text x="1210" y="751" font-size="21" fill="#203444" font-weight="normal" text-anchor="middle">3</text><line x1="1340" y1="709" x2="1340" y2="721" stroke="#536777" stroke-width="2"/><text x="1340" y="751" font-size="21" fill="#203444" font-weight="normal" text-anchor="middle">4</text><text x="73" y="700" font-size="20" fill="#203444" font-weight="normal" text-anchor="end">0</text><line x1="83" y1="690" x2="135" y2="690" stroke="#a9b6c1" stroke-width="1"/><text x="73" y="651" font-size="20" fill="#203444" font-weight="normal" text-anchor="end">0.25</text><line x1="83" y1="657.5" x2="135" y2="657.5" stroke="#a9b6c1" stroke-width="1"/><text x="73" y="282" font-size="20" fill="#203444" font-weight="normal" text-anchor="end">3.25</text><line x1="83" y1="267.5" x2="135" y2="267.5" stroke="#a9b6c1" stroke-width="1"/><text x="73" y="241" font-size="20" fill="#203444" font-weight="normal" text-anchor="end">3.45</text><line x1="83" y1="241.5" x2="135" y2="241.5" stroke="#a9b6c1" stroke-width="1"/><text x="140" y="797" font-size="23" fill="#bc3544" font-weight="normal" text-anchor="start">红色竖线：x = 1、3 的墙厚端面在此投影中呈线。</text><text x="140" y="831" font-size="23" fill="#203444" font-weight="normal" text-anchor="start">端面必须覆盖 y = 1.5…1.7（厚 0.2），不能仅保留朝向走廊的面片。</text><line x1="55" y1="863" x2="1545" y2="863" stroke="#ccd6df" stroke-width="2"/><text x="55" y="916" font-size="27" fill="#203444" font-weight="bold" text-anchor="start">B  x = 2 处的 Y–Z 断面：只画走廊右半边和侧室</text><rect x="170" y="1342.5" width="187.0" height="27.5" rx="0" fill="#e5cfa6" stroke="#536777" stroke-width="2"/><rect x="357.0" y="1342.5" width="418.0" height="27.5" rx="0" fill="#f0dfc2" stroke="#536777" stroke-width="2"/><rect x="170" y="990.5" width="187.0" height="22.0" rx="0" fill="#c9dce8" stroke="#536777" stroke-width="2"/><rect x="357.0" y="935.5" width="418.0" height="22.0" rx="0" fill="#d8e5ed" stroke="#536777" stroke-width="2"/><text x="450" y="983" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">侧室顶部更高（高度未指定）</text><line x1="357.0" y1="990.5" x2="357.0" y2="1012.5" stroke="#bc3544" stroke-width="6"/><line x1="357.0" y1="1342.5" x2="357.0" y2="1370" stroke="#bc3544" stroke-width="5"/><line x1="170" y1="1370" x2="170" y2="952.0" stroke="#416f95" stroke-width="2" stroke-dasharray="7 6"/><text x="78" y="980" font-size="21" fill="#416f95" font-weight="normal" text-anchor="start">中心线</text><line x1="335.0" y1="1342.5" x2="335.0" y2="1012.5" stroke="#98a5ae" stroke-width="2" stroke-dasharray="6 6"/><line x1="357.0" y1="1342.5" x2="357.0" y2="1012.5" stroke="#98a5ae" stroke-width="2" stroke-dasharray="6 6"/><text x="190" y="1135" font-size="23" fill="#203444" font-weight="normal" text-anchor="start">走廊右半边</text><text x="475" y="1135" font-size="27" fill="#203444" font-weight="normal" text-anchor="start">侧室</text><text x="450" y="1177" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">与走廊连通，地面同高</text><line x1="130" y1="1342.5" x2="130" y2="1012.5" stroke="#536777" stroke-width="2"/><line x1="121" y1="1342.5" x2="139" y2="1342.5" stroke="#536777" stroke-width="2"/><line x1="121" y1="1012.5" x2="139" y2="1012.5" stroke="#536777" stroke-width="2"/><text x="63" y="1190" font-size="21" fill="#203444" font-weight="normal" text-anchor="start">净高</text><text x="63" y="1220" font-size="21" fill="#203444" font-weight="normal" text-anchor="start">3 米</text><text x="65" y="1018" font-size="20" fill="#203444" font-weight="normal" text-anchor="start">3.25</text><text x="65" y="1350" font-size="20" fill="#203444" font-weight="normal" text-anchor="start">0.25</text><text x="96" y="1388" font-size="20" fill="#203444" font-weight="normal" text-anchor="start">0</text><line x1="155" y1="1405" x2="810" y2="1405" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><text x="826" y="1413" font-size="23" fill="#203444" font-weight="normal" text-anchor="start">Y</text><line x1="170" y1="1398" x2="170" y2="1412" stroke="#536777" stroke-width="2"/><line x1="335.0" y1="1398" x2="335.0" y2="1412" stroke="#536777" stroke-width="2"/><line x1="357.0" y1="1398" x2="357.0" y2="1412" stroke="#536777" stroke-width="2"/><text x="170" y="1440" font-size="21" fill="#203444" font-weight="normal" text-anchor="middle">0</text><text x="325.0" y="1440" font-size="21" fill="#203444" font-weight="normal" text-anchor="end">1.5</text><text x="363.0" y="1440" font-size="21" fill="#203444" font-weight="normal" text-anchor="start">1.7</text><line x1="98" y1="1310" x2="98" y2="1035" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><text x="85" y="1031" font-size="23" fill="#203444" font-weight="normal" text-anchor="start">Z</text><path d="M 357.0 1001.5 L 790 1025 L 855 1025" fill="none" stroke="#bc3544" stroke-width="2.5"/><text x="880" y="1018" font-size="25" fill="#bc3544" font-weight="bold" text-anchor="start">天花右侧面显露</text><text x="880" y="1055" font-size="23" fill="#203444" font-weight="normal" text-anchor="start">y = 1.7；z = 3.25…3.45</text><text x="880" y="1091" font-size="23" fill="#203444" font-weight="normal" text-anchor="start">检查几何、法线、材质与 UV。</text><text x="880" y="1155" font-size="24" fill="#203444" font-weight="bold" text-anchor="start">虚线仅示原右墙范围</text><text x="880" y="1191" font-size="23" fill="#203444" font-weight="normal" text-anchor="start">此断面位于开口内，没有残墙。</text><path d="M 357.0 1342.5 L 790 1285 L 855 1285" fill="none" stroke="#bc3544" stroke-width="2.5"/><text x="880" y="1282" font-size="25" fill="#bc3544" font-weight="bold" text-anchor="start">地面接合：y = 1.7</text><text x="880" y="1318" font-size="23" fill="#203444" font-weight="normal" text-anchor="start">顶面均为 z = 0.25；检查缝隙与重叠。</text><text x="880" y="1380" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">地板：z = 0…0.25</text><text x="880" y="1415" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">天花：z = 3.25…3.45</text><text x="55" y="1484" font-size="22" fill="#bc3544" font-weight="normal" text-anchor="start">红色 = 本次需完成或核查的可见边界；不表示钢筋、受力或结构安全设计。</text></g></svg>