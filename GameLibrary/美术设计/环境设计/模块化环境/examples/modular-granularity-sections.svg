<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1510" viewBox="0 0 1600 1510" role="img"><title>走廊破墙后的开口与显露边界</title><desc>原创重新制作的正交示意。上部为右墙X-Z正投影，下部为缺口中间x=2的Y-Z断面。单位米，红色标出需完成或核查的边界。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536777"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#203444"><text x="55" y="62" font-size="34" fill="#203444" font-weight="bold" text-anchor="start">破墙后，哪些边界变得可见？</text><text x="55" y="103" font-size="23" fill="#203444" font-weight="normal" text-anchor="start">原创正交示意 · 单位：米 · 两组视图的水平轴不同</text><text x="55" y="157" font-size="27" fill="#203444" font-weight="bold" text-anchor="start">A  右墙 X–Z 视图：沿 Y 看向墙</text><text x="140" y="210" font-size="24" fill="#203444" font-weight="bold" text-anchor="start">完整右墙</text><text x="820" y="210" font-size="24" fill="#203444" font-weight="bold" text-anchor="start">替换为破墙资产</text><rect x="140" y="657.5" width="520" height="32.5" rx="0" fill="#e5cfa6" stroke="#536777" stroke-width="2"/><rect x="140" y="241.5" width="520" height="26" rx="0" fill="#c9dce8" stroke="#536777" stroke-width="2"/><rect x="140" y="267.5" width="520" height="390" rx="0" fill="#dce4e8" stroke="#536777" stroke-width="2"/><line x1="112" y1="690" x2="112" y2="238" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><text x="87" y="233" font-size="23" fill="#203444" font-weight="normal" text-anchor="start">Z</text><line x1="140" y1="715" x2="695" y2="715" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><text x="700" y="724" font-size="23" fill="#203444" font-weight="normal" text-anchor="start">X</text><line x1="140" y1="709" x2="140" y2="721" stroke="#536777" stroke-width="2"/><text x="140" y="751" font-size="21" fill="#203444" font-weight="normal" text-anchor="middle">0</text><line x1="270" y1="709" x2="270" y2="721" stroke="#536777" stroke-width="2"/><tex