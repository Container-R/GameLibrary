<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1370" viewBox="0 0 1680 1370" role="img"><title>资源、组合与实例的引用和覆盖</title><desc>原创重新制作依赖图，箭头由使用者指向被引用资源或基础组合。资源内容修改、引用字段更换和局部覆盖必须区分。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#536777"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#203444"><text x="55" y="62" font-size="34" fill="#203444" font-weight="bold" text-anchor="start">先辨认依赖，再判断修改影响谁</text><line x1="55" y1="108" x2="135" y2="108" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><text x="150" y="116" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">实线：使用者 → 引用的网格资源</text><line x1="760" y1="108" x2="840" y2="108" stroke="#536777" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="855" y="116" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">虚线：实例 / 变体 → 来源 / 基础组合</text><text x="55" y="175" font-size="27" fill="#203444" font-weight="bold" text-anchor="start">1  网格资源</text><text x="590" y="175" font-size="27" fill="#203444" font-weight="bold" text-anchor="start">2  保存装配关系</text><text x="1190" y="175" font-size="27" fill="#203444" font-weight="bold" text-anchor="start">3  关卡中的实例</text><rect x="55" y="220" width="380" height="125" rx="12" fill="#f3f6f8" stroke="#b8c7d2" stroke-width="2"/><text x="77" y="259" font-size="25" fill="#203444" font-weight="bold" text-anchor="start">F0 · 标准地板</text><text x="77" y="298" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">几何与材料分配</text><rect x="55" y="400" width="380" height="125" rx="12" fill="#f3f6f8" stroke="#b8c7d2" stroke-width="2"/><text x="77" y="439" font-size="25" fill="#203444" font-weight="bold" text-anchor="start">F1 · 替换地板</text><text x="77" y="478" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">边界与顶面符合相同接口</text><rect x="55" y="580" width="380" height="125" rx="12" fill="#f3f6f8" stroke="#b8c7d2" stroke-width="2"/><text x="77" y="619" font-size="25" fill="#203444" font-weight="bold" text-anchor="start">F_break · 破墙用地板</text><text x="77" y="658" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">变体独立指定的引用</text><rect x="55" y="760" width="380" height="175" rx="12" fill="#f3f6f8" stroke="#b8c7d2" stroke-width="2"/><text x="77" y="799" font-size="25" fill="#203444" font-weight="bold" text-anchor="start">其他墙、顶网格资源</text><text x="77" y="838" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">左墙 / 完整右墙 / 天花</text><text x="77" y="872" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">右侧破墙网格</text><text x="77" y="906" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">必要时提供天花变体</text><rect x="590" y="220" width="480" height="235" rx="12" fill="#f3f6f8" stroke="#b8c7d2" stroke-width="2"/><text x="612" y="259" font-size="25" fill="#203444" font-weight="bold" text-anchor="start">标准组合</text><text x="612" y="298" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">地板字段 = F0</text><text x="612" y="332" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">左墙 + 完整右墙 + 天花</text><text x="612" y="366" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">保存子件的相对变换</text><text x="612" y="400" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">本图初始状态：尚未换成 F1</text><rect x="590" y="580" width="480" height="265" rx="12" fill="#fdf3e3" stroke="#b8c7d2" stroke-width="2"/><text x="612" y="619" font-size="25" fill="#203444" font-weight="bold" text-anchor="start">可复用破墙变体</text><text x="612" y="658" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">继承标准组合的共同部分</text><text x="612" y="692" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">覆盖：地板字段 = F_break</text><text x="612" y="726" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">覆盖：右墙 = 破墙网格</text><text x="612" y="760" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">核查天花侧面与地面收口</text><text x="612" y="794" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">必要时覆盖天花引用</text><rect x="1190" y="220" width="435" height="155" rx="12" fill="#f3f6f8" stroke="#b8c7d2" stroke-width="2"/><text x="1212" y="259" font-size="25" fill="#203444" font-weight="bold" text-anchor="start">普通实例</text><text x="1212" y="298" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">来自标准组合，无地板覆盖</text><text x="1212" y="332" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">当前实际引用 F0</text><rect x="1190" y="420" width="435" height="160" rx="12" fill="#edf5f8" stroke="#b8c7d2" stroke-width="2"/><text x="1212" y="459" font-size="25" fill="#203444" font-weight="bold" text-anchor="start">局部换地板实例</text><text x="1212" y="498" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">来自标准组合</text><text x="1212" y="532" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">覆盖地板字段为 F1</text><rect x="1190" y="650" width="435" height="155" rx="12" fill="#fdf3e3" stroke="#b8c7d2" stroke-width="2"/><text x="1212" y="689" font-size="25" fill="#203444" font-weight="bold" text-anchor="start">破墙变体实例</text><text x="1212" y="728" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">来自破墙变体，无额外覆盖</text><text x="1212" y="762" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">当前实际引用 F_break</text><line x1="590" y1="282" x2="435" y2="282" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><text x="459" y="263" font-size="20" fill="#203444" font-weight="normal" text-anchor="start">引用 F0</text><line x1="590" y1="650" x2="435" y2="650" stroke="#536777" stroke-width="2" marker-end="url(#arrow)"/><text x="444" y="630" font-size="20" fill="#203444" font-weight="normal" text-anchor="start">引用 F_break</text><line x1="830" y1="580" x2="830" y2="455" stroke="#536777" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="850" y="492" font-size="21" fill="#203444" font-weight="normal" text-anchor="start">继承</text><line x1="1190" y1="280" x2="1070" y2="280" stroke="#536777" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M1190 455 L1125 455 L1125 355 L1070 355" fill="none" stroke="#536777" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><line x1="1190" y1="720" x2="1070" y2="720" stroke="#536777" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M1190 540 L515 540 L515 465 L435 465" fill="none" stroke="#536777" stroke-width="2.5" marker-end="url(#arrow)"/><text x="580" y="522" font-size="21" fill="#416f95" font-weight="normal" text-anchor="start">本实例覆盖：直接引用 F1</text><path d="M590 405 L475 405 L475 810 L435 810" fill="none" stroke="#536777" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M590 795 L535 795 L535 870 L435 870" fill="none" stroke="#536777" stroke-width="2.5" marker-end="url(#arrow)"/><text x="590" y="898" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">墙 / 顶引用按各组合字段连接左侧资源。</text><text x="590" y="936" font-size="22" fill="#bc3544" font-weight="normal" text-anchor="start">箭头只描述依赖，不表示自动合并网格。</text><line x1="55" y1="978" x2="1625" y2="978" stroke="#ccd6df" stroke-width="2"/><text x="55" y="1027" font-size="27" fill="#203444" font-weight="bold" text-anchor="start">三种修改，三种检查范围</text><rect x="55" y="1060" width="500" height="210" rx="12" fill="#f3f6f8" stroke="#b8c7d2" stroke-width="2"/><text x="77" y="1099" font-size="25" fill="#203444" font-weight="bold" text-anchor="start">A  修改 F0 资源内容</text><text x="77" y="1138" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">查仍实际引用 F0 的位置。</text><text x="77" y="1172" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">本图：标准组合与普通实例。</text><text x="77" y="1206" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">F1、F_break 是不同资源。</text><text x="77" y="1240" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">导入与刷新时机须核对工具。</text><rect x="590" y="1060" width="500" height="210" rx="12" fill="#f3f6f8" stroke="#b8c7d2" stroke-width="2"/><text x="612" y="1099" font-size="25" fill="#203444" font-weight="bold" text-anchor="start">B  标准组合：F0 → F1</text><text x="612" y="1138" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">这是更换地板引用字段。</text><text x="612" y="1172" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">普通实例继承新字段值。</text><text x="612" y="1206" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">破墙变体已有 F_break 覆盖，</text><text x="612" y="1240" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">不会因此改用 F1。</text><rect x="1125" y="1060" width="500" height="210" rx="12" fill="#f3f6f8" stroke="#b8c7d2" stroke-width="2"/><text x="1147" y="1099" font-size="25" fill="#203444" font-weight="bold" text-anchor="start">C  某实例覆盖为 F1</text><text x="1147" y="1138" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">覆盖仅属于该实例。</text><text x="1147" y="1172" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">不改标准组合的 F0 字段，</text><text x="1147" y="1206" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">也不修改 F0 或 F1 的内容。</text><text x="1147" y="1240" font-size="22" fill="#203444" font-weight="normal" text-anchor="start">后续公共改动须复查覆盖。</text><text x="55" y="1323" font-size="23" fill="#203444" font-weight="normal" text-anchor="start">拆解组合不等于复制网格资源；须分别核查剩余装配关系、字段覆盖和共享资源引用。</text><line x1="467" y1="465" x2="483" y2="465" stroke="#ffffff" stroke-width="9"/><line x1="465" y1="465" x2="485" y2="465" stroke="#536777" stroke-width="2.5"/><line x1="467" y1="650" x2="483" y2="650" stroke="#ffffff" stroke-width="9"/><line x1="465" y1="650" x2="485" y2="650" stroke="#536777" stroke-width="2.5"/><line x1="822" y1="540" x2="838" y2="540" stroke="#ffffff" stroke-width="9"/><line x1="820" y1="540" x2="840" y2="540" stroke="#536777" stroke-width="2.5"/></g></svg>