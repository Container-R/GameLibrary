<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="790" viewBox="0 0 1220 790">
<title>R_phase 房间西门至南门的五件合法回接</title>
<rect width="1220" height="790" fill="#f7f9fc"/>
<style>text{font-family:Noto Sans CJK SC, sans-serif;fill:#193047;font-size:20px} .small{font-size:17px} .title{font-size:30px;font-weight:700} .sub{font-size:24px;font-weight:600} .mono{font-family:Noto Sans Mono CJK SC,monospace;font-size:18px}</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#234b70"/></marker></defs>
<text x="34" y="48" class="title" >R_phase：从西门到南门的一条合法路线</text>
<text x="34" y="84" class="small" >原创坐标示例。X 向右、Y 向上；每小格 2 米；所有端口 z = 0.4。</text>
<line x1="80" y1="125" x2="80" y2="688" stroke="#d3deea" stroke-width="1" />
<text x="68" y="715" class="small" >-8</text>
<line x1="168" y1="125" x2="168" y2="688" stroke="#d3deea" stroke-width="1" />
<text x="156" y="715" class="small" >-6</text>
<line x1="256" y1="125" x2="256" y2="688" stroke="#d3deea" stroke-width="1" />
<text x="244" y="715" class="small" >-4</text>
<line x1="344" y1="125" x2="344" y2="688" stroke="#d3deea" stroke-width="1" />
<text x="332" y="715" class="small" >-2</text>
<line x1="432" y1="125" x2="432" y2="688" stroke="#d3deea" stroke-width="1" />
<text x="420" y="715" class="small" >0</text>
<line x1="520" y1="125" x2="520" y2="688" stroke="#d3deea" stroke-width="1" />
<text x="508" y="715" class="small" >2</text>
<line x1="608" y1="125" x2="608" y2="688" stroke="#d3deea" stroke-width="1" />
<text x="596" y="715" class="small" >4</text>
<line x1="62" y1="670" x2="625" y2="670" stroke="#d3deea" stroke-width="1" />
<text x="35" y="676" class="small" >-8</text>
<line x1="62" y1="582" x2="625" y2="582" stroke="#d3deea" stroke-width="1" />
<text x="35" y="588" class="small" >-6</text>
<line x1="62" y1="494" x2="625" y2="494" stroke="#d3deea" stroke-width="1" />
<text x="35" y="500" class="small" >-4</text>
<line x1="62" y1="406" x2="625" y2="406" stroke="#d3deea" stroke-width="1" />
<text x="35" y="412" class="small" >-2</text>
<line x1="62" y1="318" x2="625" y2="318" stroke="#d3deea" stroke-width="1" />
<text x="35" y="324" class="small" >0</text>
<line x1="62" y1="230" x2="625" y2="230" stroke="#d3deea" stroke-width="1" />
<text x="35" y="236" class="small" >2</text>
<line x1="62" y1="142" x2="625" y2="142" stroke="#d3deea" stroke-width="1" />
<text x="35" y="148" class="small" >4</text>
<rect x="256" y="142" width="352" height="352" fill="#d8e5f2" stroke="#496a94" stroke-width="2" />
<text x="346" y="277" class="sub" >8 × 8 米房间</text>
<text x="361" y="313" class="sub" >R_phase</text>
<rect x="80" y="142" width="176" height="176" fill="#dbf1e8" stroke="#39987b" stroke-width="2" />
<text x="95" y="172" class="small" >1：C 180°</text>
<rect x="80" y="318" width="176" height="176" fill="#dbf1e8" stroke="#39987b" stroke-width="2" />
<text x="95" y="348" class="small" >2：S 90°</text>
<rect x="80" y="494" width="176" height="176" fill="#dbf1e8" stroke="#39987b" stroke-width="2" />
<text x="95" y="524" class="small" >3：C 270°</text>
<rect x="256" y="494" width="176" height="176" fill="#dbf1e8" stroke="#39987b" stroke-width="2" />
<text x="271" y="524" class="small" >4：S 0°</text>
<rect x="432" y="494" width="176" height="176" fill="#dbf1e8" stroke="#39987b" stroke-width="2" />
<text x="447" y="524" class="small" >5：C 0°</text>
<polyline points="256,230 168,230 168,582 520,582 520,494" fill="none" stroke="#087d61" stroke-width="6"/>
<circle cx="256" cy="230" r="6" fill="#05836b"/>
<circle cx="168" cy="318" r="6" fill="#05836b"/>
<circle cx="168" cy="494" r="6" fill="#05836b"/>
<circle cx="256" cy="582" r="6" fill="#05836b"/>
<circle cx="432" cy="582" r="6" fill="#05836b"/>
<circle cx="520" cy="494" r="6" fill="#05836b"/>
<circle cx="168" cy="230" r="4" fill="#243d59"/>
<circle cx="168" cy="406" r="4" fill="#243d59"/>
<circle cx="168" cy="582" r="4" fill="#243d59"/>
<circle cx="344" cy="582" r="4" fill="#243d59"/>
<circle cx="520" cy="582" r="4" fill="#243d59"/>
<text x="266" y="218" class="small" >西门 (-4,2)</text>
<text x="370" y="479" class="small" >南门 (2,-4)</text>
<rect x="665" y="124" width="520" height="553" fill="#ffffff" stroke="#c1d0df" stroke-width="2" />
<text x="690" y="168" class="sub" >逐项核对</text>
<text x="690" y="213" class="small" >1. 端口位置重合，向外法线相反。</text>
<text x="690" y="253" class="small" >2. 所有开口宽高、底边高度相同。</text>
<text x="690" y="293" class="small" >3. 枢轴位于二米网格，同属</text>
<text x="690" y="325" class="small" >   (2,2) mod 4。</text>
<text x="690" y="365" class="small" >4. 五个走廊与房间的足迹内部</text>
<text x="690" y="397" class="small" >   互不重叠；允许边界接触。</text>
<text x="690" y="460" class="sub" >R_center 的门位则不成立</text>
<text x="690" y="501" class="mono" >西门 (-4,0) → 首枢轴 (-6,0)</text>
<text x="690" y="537" class="mono" >相连枢轴始终属于 (2,0) mod 4</text>
<text x="690" y="573" class="mono" >朝北出口只能属于 (2,2) mod 4</text>
<text x="690" y="609" class="mono" >南门 (0,-4) 属于 (0,0) mod 4</text>
<text x="34" y="760" class="small" >绿线表示连接关系，不是角色轨迹。无解推导只适用于正文限定的 S/C 库与允许变换；增加转接件后需重新分析。</text>
</svg>